name: Render automation pulse

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-pulse-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout metrics fork (contains automation-pulse plugin)
        uses: actions/checkout@v4
        with:
          repository: SHA-data/metrics # <-- change if your fork lives elsewhere
          ref: master

      - name: Build metrics image (cached)
        run: >
          docker buildx build --load
          --cache-from type=gha
          --cache-to type=gha,mode=max
          -t metrics-local .

      - name: Ensure output branch exists
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          SHA=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/output --jq '.object.sha' 2>/dev/null || true)
          if [ -z "$SHA" ]; then
            BASE=$(gh api repos/${GITHUB_REPOSITORY} --jq '.default_branch')
            BASE_SHA=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/$BASE --jq '.object.sha')
            gh api -X POST repos/${GITHUB_REPOSITORY}/git/refs -f ref=refs/heads/output -f sha=$BASE_SHA
            echo "Created output branch"
          fi

      - name: Render and commit card
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_USER: SHA-data
          INPUT_TOKEN: ${{ secrets.METRICS_TOKEN }}
          INPUT_BASE: ""
          INPUT_FILENAME: metrics.automation-pulse.svg
          INPUT_OUTPUT_ACTION: commit
          INPUT_COMMITTER_BRANCH: output
          INPUT_COMMITTER_MESSAGE: "chore: refresh automation-pulse [skip ci]"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: >
          docker run --rm
          -e GITHUB_REPOSITORY
          -e INPUT_USER -e INPUT_TOKEN -e INPUT_BASE
          -e INPUT_FILENAME -e INPUT_OUTPUT_ACTION
          -e INPUT_COMMITTER_BRANCH -e INPUT_COMMITTER_MESSAGE
          -e INPUT_PLUGIN_AUTOMATION-PULSE=yes
          -e INPUT_DRYRUN=no -e INPUT_USE_MOCKED_DATA=no
          -e GROQ_API_KEY
          metrics-local
